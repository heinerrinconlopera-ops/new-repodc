<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Contacto</title>
  </head>
  <body>
    <h1>Hola este es mi numero de teléfono</h1>
    <p>Aquí pondré mis datos de contacto.</p>
    <a href="index.html">← Volver al inicio</a>
    <main>
      <section>
        <h2>formulario de contacto</h2>
        <form>
          <p>
            <label for="Nombre:">nombre:</label><br>
            <input type="text" id="nombre" name="nombre" required placeholder="tu nombre">
          </p>
          <p>
            <label for="correo">correo:</label><br>
            <input type="email" id="correo" name="correo" required placeholder="tu correo@ejemplo.com">
          </p>
          <p>
            <label for="motivo">motivo:</label><br>
            <select id="motivo" name="motivo">
              <option value="pregunta">Tengo una pregunta</option>
              <option value="proyecto">Quiero proponerte un proyecto</option>
              <option value="otro">Otro</option>
              </select>
          </p>

          
      </section>
    </main>
  </body>
</html>
